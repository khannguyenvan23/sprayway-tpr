<html>
<head>
<title>GoogleMap</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<script type="text/javascript"
	src="http://maps.google.com/maps/api/js?sensor=true"></script>
<script type="text/javascript">
var map;
var infowindow;

function initialize(){
contentString = '<div style="width: 300px; padding-right: 5px; font-family: Arial; font-size: 12px;">SPRAYWAY – TPR CO., LTD<br>VPGD: Số 720A Điện Biên Phủ, Phường 22, Quận Bình Thạnh, TP Hồ Chí Minh&lt;br&gt;Điện thoại:  (+84)909 407 288</div>';

var defaultLatLng = new google.maps.LatLng(10.800405701917759, 106.65231227874756);
var myOptions= {zoom: 15,
center: defaultLatLng,
scrollwheel : false,
mapTypeId: google.maps.MapTypeId.ROADMAP};
map = new google.maps.Map(document.getElementById("map_canvas"), myOptions);
map.setCenter(defaultLatLng);

clickmarker = new google.maps.Marker({
position: defaultLatLng,
clickable: true,
cursor: "pointer",
map: map
});

infowindow= new google.maps.InfoWindow({content: contentString});
infowindow.open(map, clickmarker);

google.maps.event.addListener(clickmarker, 'click', function(){
infowindow.open(map, clickmarker);
});

}

</script>


<body onLoad="initialize();" style="margin:0px;" >
<div id="map_canvas" style="width: 680px; height: 460px"></div>
</body>
</html>
