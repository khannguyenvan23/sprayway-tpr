<script language=javascript>
	function checkform(f) {			
		var re =/^[_a-z0-9-]+(\.[_a-z0-9-]+)*@[a-z0-9-]+(\.[a-z0-9-]+)*(\.[a-z]{2,5})$/gi;
		
		var name_from = f.name_from.value;
		if (name_from == '') {
			alert('Vui lòng nhập tên người nhận');
			f.name_from.focus();
			return false;
		}
			 
		email_from = f.email_from.value;
		if (email_from == '') {
			alert('Vui lòng nhập email người nhận');
			f.email_from.focus();
			return false;
		}
		if (email_from != '' && email_from.match(re)==null) {
			alert('Email không hợp lệ');
			f.email_from.focus();
			return false;
		}
		
		var name_to = f.name_to.value;
		if (name_to == '') {
			alert('Vui lòng nhập tên người nhận');
			f.name_to.focus();
			return false;
		}
			 
		email_to = f.email_to.value;
		if (email_to == '') {
			alert('Vui lòng nhập email người gửi');
			f.email_to.focus();
			return false;
		}
		if (email_to != '' && email_to.match(re)==null) {
			alert('Email không hợp lệ');
			f.email_to.focus();
			return false;
		}
		
		var content = f.content.value;
		if (content == '') {
			alert('Vui lòng nhập nội dung đánh giá');
			f.content.focus();
			return false;
		}
		
		if (f.h_code.value != f.security_code.value ) {
			alert('Mã bảo vệ không chính xác');
			f.security_code.focus();
			return false;
		}

		return true;
	}
</script>
